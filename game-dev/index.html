<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bhanu Saini | Solarpunk Portfolio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --c-primary: #2563eb; 
            --c-accent: #f59e0b; 
            --c-text: #1e293b;
            --c-bg-ui: rgba(255, 255, 255, 0.85);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { overflow: hidden; background: #e0f2fe; font-family: 'Outfit', sans-serif; color: var(--c-text); }
        
        #canvas-container { position: absolute; inset: 0; z-index: 1; }
        
        /* UI Layer */
        #ui-layer {
            position: absolute; inset: 0; z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 25px;
        }

        /* HUD */
        .hud-top {
            display: flex; justify-content: space-between; align-items: flex-start;
        }
        
        .profile-card {
            background: var(--c-bg-ui); 
            padding: 20px 30px; 
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.5);
            animation: slideDown 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            max-width: 350px;
        }
        .profile-card h1 { font-weight: 900; font-size: 1.5rem; letter-spacing: -0.5px; color: #0f172a; margin-bottom: 5px; }
        .profile-card p { color: var(--c-primary); font-weight: 700; font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase; }

        .nav-pills {
            display: flex; gap: 10px; flex-direction: column; align-items: flex-end;
            animation: slideDown 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.1s backwards;
        }
        .nav-pill {
            background: var(--c-bg-ui); padding: 8px 16px; border-radius: 30px;
            font-weight: 700; font-size: 0.75rem; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex; align-items: center; gap: 8px;
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; }

        /* Controls Hint */
        .controls-hint {
            position: absolute; bottom: 30px; right: 30px;
            background: var(--c-bg-ui); padding: 20px; border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: right; backdrop-filter: blur(10px);
        }
        .key {
            display: inline-block; background: #fff; color: #334155;
            padding: 6px 10px; border-radius: 6px; font-weight: 800; font-size: 12px;
            margin: 2px; box-shadow: 0 3px 0 #cbd5e1; border: 1px solid #e2e8f0;
        }

        /* Modal */
        #modal {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 90%; max-width: 550px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            opacity: 0; pointer-events: none;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 20; display: flex; flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            border: 1px solid #fff;
        }
        #modal.active { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
        
        .modal-header { padding: 30px 30px 10px; }
        .modal-badge { 
            display: inline-block; padding: 6px 12px; border-radius: 20px; 
            font-size: 0.7rem; font-weight: 800; letter-spacing: 0.5px; margin-bottom: 10px; color: white;
        }
        
        #modal-title { 
            font-weight: 900; font-size: 2rem; color: #0f172a; line-height: 1.1; margin-bottom: 10px; 
        }
        
        .modal-body { padding: 0 30px 30px; }
        #modal-desc { color: #475569; font-size: 1.05rem; line-height: 1.6; margin-bottom: 25px; }
        
        .tags-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 25px; }
        .tag { 
            background: #f1f5f9; color: #334155; padding: 6px 12px; 
            border-radius: 8px; font-size: 0.75rem; font-weight: 700;
        }
        
        .action-btn {
            display: block; background: #0f172a; color: #fff; text-align: center;
            padding: 16px; font-weight: 700; border-radius: 12px;
            text-decoration: none; transition: transform 0.2s, background 0.2s;
        }
        .action-btn:hover { transform: translateY(-2px); background: #1e293b; }

        /* Loader */
        #loader {
            position: fixed; inset: 0; background: #eff6ff; z-index: 100;
            display: flex; align-items: center; justify-content: center; flex-direction: column;
            transition: opacity 0.6s ease-in-out;
        }
        .spinner {
            width: 50px; height: 50px; border: 4px solid #bfdbfe; border-top: 4px solid #2563eb;
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
        }

        /* Mobile */
        #mobile-ui { display: none; pointer-events: none; position: absolute; inset: 0; }
        .joystick-zone { position: absolute; bottom: 40px; left: 40px; width: 140px; height: 140px; pointer-events: auto; background: rgba(255,255,255,0.2); border-radius: 50%; backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.4); }
        .joystick-nub { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 50px; height: 50px; background: white; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .boost-btn {
            position: absolute; bottom: 60px; right: 40px; width: 70px; height: 70px;
            background: white; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            display: flex; align-items: center; justify-content: center; pointer-events: auto;
            color: #2563eb; font-weight: 900; font-size: 12px;
        }
        .boost-btn:active { transform: scale(0.95); background: #f8fafc; }

        @media (max-width: 768px) {
            .controls-hint { display: none; }
            #mobile-ui { display: block; }
            .profile-card { padding: 15px; margin-top: 40px; } /* Push down for mobile safe area */
            .nav-pills { display: none; }
        }

        @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div style="font-weight: 700; color: #2563eb; letter-spacing: 1px;">BUILDING WORLD...</div>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="profile-card">
                <h1>BHANU SAINI</h1>
                <p>Interactive Portfolio v4.0</p>
            </div>
            <div class="nav-pills">
                <div class="nav-pill" style="color: #db2777"><div class="dot" style="background:#db2777"></div> GAMES (North)</div>
                <div class="nav-pill" style="color: #2563eb"><div class="dot" style="background:#2563eb"></div> WEB (West)</div>
                <div class="nav-pill" style="color: #ca8a04"><div class="dot" style="background:#ca8a04"></div> DATA (East)</div>
            </div>
        </div>

        <div class="controls-hint">
            <div style="margin-bottom:8px; color:#64748b; font-weight:600; font-size:0.8rem;">HOVER CONTROLS</div>
            <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> to Drive<br>
            <span class="key" style="width: 60px; margin-top:8px;">SPACE</span> to Boost
        </div>

        <div id="mobile-ui">
            <div class="joystick-zone" id="joystick-zone"><div class="joystick-nub" id="stick-nub"></div></div>
            <div class="boost-btn" id="boost-btn">BOOST</div>
        </div>
    </div>

    <div id="modal">
        <div class="modal-header">
            <span class="modal-badge" id="modal-badge">CATEGORY</span>
            <h2 id="modal-title">Project Title</h2>
        </div>
        <div class="modal-body">
            <p id="modal-desc">Description text.</p>
            <div class="tags-container" id="modal-tags"></div>
            <a href="#" target="_blank" class="action-btn" id="modal-link">VIEW PROJECT</a>
        </div>
    </div>

    <script>
        // --- DATA ---
        const ZONES = {
            GAMES: { color: 0xdb2777, name: "GAME DEV", hex: "#db2777" },
            WEB: { color: 0x2563eb, name: "WEB DEV", hex: "#2563eb" },
            DATA: { color: 0xca8a04, name: "DATA SCIENCE", hex: "#ca8a04" }
        };

        // Expanded Project List
        const PROJECTS = [
            // --- GAMES (North / Z Negative) ---
            { title: "Echo Shooter", desc: "Neon arena shooter. Survive waves, use overdrive abilities, and score combos.", tech: ["JS", "Canvas", "Action"], link: "https://echo-shooter.pages.dev", type: "GAMES", pos: {x: 0, z: -40} },
            { title: "Portal Nexus", desc: "Survival RPG in a 100-room labyrinth with shifting portals and secrets.", tech: ["React", "TypeScript", "RPG"], link: "https://portal-nexus.pages.dev", type: "GAMES", pos: {x: -30, z: -60} },
            { title: "Neon Maze", desc: "3D Procedural maze escape with time limits and laser traps.", tech: ["Three.js", "WebGL"], link: "https://bhanu2006-24.github.io/neon-maze", type: "GAMES", pos: {x: 30, z: -60} },
            { title: "Antigravity", desc: "Top-down shooter experimenting with gravity mechanics and boss AI.", tech: ["Physics", "Canvas"], link: "https://antigravity-game.pages.dev", type: "GAMES", pos: {x: -15, z: -80} },
            { title: "Bomber Legends", desc: "Classic arcade bomber remake with destructible grid environments.", tech: ["React", "Grid Logic"], link: "https://bomber-legends.pages.dev", type: "GAMES", pos: {x: 15, z: -80} },

            // --- WEB (West / X Negative) ---
            { title: "NovaNews", desc: "Modern news aggregator with clean UI and smart categorization.", tech: ["React 19", "Vite", "API"], link: "https://github.com/bhanu2006-24/novanews", type: "WEB", pos: {x: -50, z: 0} },
            { title: "GrooveWave", desc: "Music analytics SaaS dashboard with real-time visualization.", tech: ["SaaS", "Data Viz"], link: "https://github.com/bhanu2006-24", type: "WEB", pos: {x: -75, z: 20} },
            { title: "Atmosphere AI", desc: "Environmental monitoring dashboard powered by AI predictions.", tech: ["AI", "Analytics"], link: "https://github.com/bhanu2006-24", type: "WEB", pos: {x: -75, z: -20} },
            { title: "RemoteNexus", desc: "Job portal connecting professionals with premium remote work.", tech: ["React", "Node.js"], link: "https://github.com/bhanu2006-24", type: "WEB", pos: {x: -100, z: 0} },
            { title: "Krishna Books", desc: "Online bookstore and library management system.", tech: ["E-commerce", "Web"], link: "https://github.com/bhanu2006-24", type: "WEB", pos: {x: -50, z: 35} },

            // --- DATA (East / X Positive) ---
            { title: "Crypto Pulse", desc: "Live cryptocurrency market tracker with portfolio management.", tech: ["React", "Finance API"], link: "https://github.com/bhanu2006-24/crypto-pulse", type: "DATA", pos: {x: 50, z: 0} },
            { title: "IMDb Analytics", desc: "Data dashboard analyzing movie trends and correlations.", tech: ["Python", "Plotly"], link: "https://github.com/bhanu2006-24", type: "DATA", pos: {x: 75, z: 20} },
            { title: "Img Toolkit", desc: "Browser-based image processing tools (remove bg, filters).", tech: ["Streamlit", "CV"], link: "https://github.com/bhanu2006-24/img-toolkit", type: "DATA", pos: {x: 75, z: -20} },
            { title: "T-Shirt Gen", desc: "Procedural design generator for apparel using computer vision.", tech: ["Python", "OpenCV"], link: "https://github.com/bhanu2006-24/tshirtgen", type: "DATA", pos: {x: 100, z: 0} },
            { title: "Steam Analytics", desc: "End-to-end pipeline scraping Steam data for market trends.", tech: ["Scraping", "Pandas"], link: "https://github.com/bhanu2006-24", type: "DATA", pos: {x: 50, z: 35} }
        ];

        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe0f2fe); // Sky blue
        scene.fog = new THREE.Fog(0xe0f2fe, 20, 120);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 300);
        camera.position.set(0, 40, 50);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // --- LIGHTING (Daylight) ---
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0xe0f2fe, 0.6);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xfff7ed, 1.2);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.left = -100; dirLight.shadow.camera.right = 100;
        dirLight.shadow.camera.top = 100; dirLight.shadow.camera.bottom = -100;
        scene.add(dirLight);

        // --- WORLD GENERATION ---
        
        // Ground - Clean Grid
        const groundGeo = new THREE.PlaneGeometry(400, 400);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0xf8fafc });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI/2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Road Grid Texture (Procedural logic)
        const roadGroup = new THREE.Group();
        const roadMat = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, roughness: 0.8 });
        
        // Main Axis Roads
        const roadZ = new THREE.Mesh(new THREE.PlaneGeometry(12, 400), roadMat);
        roadZ.rotation.x = -Math.PI/2; roadZ.position.y = 0.05; roadZ.receiveShadow = true;
        roadGroup.add(roadZ);
        
        const roadX = new THREE.Mesh(new THREE.PlaneGeometry(400, 12), roadMat);
        roadX.rotation.x = -Math.PI/2; roadX.position.y = 0.06; roadX.receiveShadow = true;
        roadGroup.add(roadX);

        scene.add(roadGroup);

        // Trees (Decor)
        const treeGeo = new THREE.ConeGeometry(1.5, 4, 8);
        const trunkGeo = new THREE.CylinderGeometry(0.5, 0.5, 1, 8);
        const treeMat = new THREE.MeshLambertMaterial({ color: 0x10b981 }); // Emerald green
        const trunkMat = new THREE.MeshLambertMaterial({ color: 0x78350f });

        function createTree(x, z) {
            const grp = new THREE.Group();
            const top = new THREE.Mesh(treeGeo, treeMat);
            top.position.y = 2.5; top.castShadow = true;
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 0.5;
            grp.add(top); grp.add(trunk);
            grp.position.set(x, 0, z);
            return grp;
        }

        // Add random trees
        for(let i=0; i<60; i++) {
            const x = (Math.random()-0.5)*300;
            const z = (Math.random()-0.5)*300;
            if(Math.abs(x) > 10 && Math.abs(z) > 10) { // Avoid center
                scene.add(createTree(x, z));
            }
        }

        // --- PROJECTS / BUILDINGS ---
        const interactables = [];

        // Helper: 3D Text
        function createTextSprite(text, color) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.font = '900 60px "Outfit"';
            ctx.fillStyle = color;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 256, 64);
            const tex = new THREE.CanvasTexture(canvas);
            const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(12, 3, 1);
            return sprite;
        }

        PROJECTS.forEach(p => {
            const config = ZONES[p.type];
            const group = new THREE.Group();
            group.position.set(p.pos.x, 0, p.pos.z);

            let mesh;
            
            if(p.type === 'GAMES') {
                // Arcade / Console shape
                const geo = new THREE.BoxGeometry(4, 6, 4);
                const mat = new THREE.MeshStandardMaterial({ color: 0xfce7f3 }); // Light pink
                mesh = new THREE.Mesh(geo, mat);
                mesh.position.y = 3;
                
                const screen = new THREE.Mesh(new THREE.PlaneGeometry(3, 2), new THREE.MeshBasicMaterial({ color: config.color }));
                screen.position.set(0, 4.5, 2.05);
                group.add(screen);

                // Add bouncy rings
                const ring = new THREE.Mesh(new THREE.TorusGeometry(3, 0.2, 8, 16), new THREE.MeshBasicMaterial({ color: config.color }));
                ring.rotation.x = Math.PI/2; ring.position.y = 1;
                group.add(ring);
            } 
            else if(p.type === 'WEB') {
                // Modern Glass Building
                const geo = new THREE.BoxGeometry(6, 10, 6);
                const mat = new THREE.MeshPhysicalMaterial({ 
                    color: 0xffffff, metalness: 0.1, roughness: 0.1, transmission: 0.2, opacity: 0.9, transparent: true 
                });
                mesh = new THREE.Mesh(geo, mat);
                mesh.position.y = 5;
                
                // Internal Core
                const core = new THREE.Mesh(new THREE.BoxGeometry(3, 8, 3), new THREE.MeshLambertMaterial({ color: config.color }));
                core.position.y = 5;
                group.add(core);
            } 
            else { // DATA
                // Server Rack / Lab
                const geo = new THREE.CylinderGeometry(4, 4, 7, 6);
                const mat = new THREE.MeshStandardMaterial({ color: 0xfffbeb }); // Light yellow
                mesh = new THREE.Mesh(geo, mat);
                mesh.position.y = 3.5;
                
                // Rings
                const ring = new THREE.Mesh(new THREE.TorusGeometry(4.2, 0.2, 8, 32), new THREE.MeshBasicMaterial({ color: config.color }));
                ring.rotation.x = Math.PI/2; ring.position.y = 5;
                group.add(ring);
            }

            mesh.castShadow = true; mesh.receiveShadow = true;
            group.add(mesh);

            // Label
            const label = createTextSprite(p.title, config.hex);
            label.position.set(0, 10, 0);
            group.add(label);

            scene.add(group);
            
            interactables.push({
                pos: p.pos,
                radius: 8,
                data: p,
                config: config,
                mesh: group
            });
        });

        // --- PLAYER (HOVER CAR) ---
        const car = new THREE.Group();
        
        // Body (Sleek)
        const bodyGeo = new THREE.BoxGeometry(2.2, 0.6, 4.5);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0.5 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 1;
        body.castShadow = true;
        car.add(body);

        // Glass Cockpit
        const glassGeo = new THREE.BoxGeometry(1.8, 0.5, 2.5);
        const glassMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.1, metalness: 0.8 });
        const cockpit = new THREE.Mesh(glassGeo, glassMat);
        cockpit.position.set(0, 1.5, -0.2);
        car.add(cockpit);

        // Hover Engines (Glowing rings below)
        const engineGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.2, 16);
        const engineMat = new THREE.MeshBasicMaterial({ color: 0x60a5fa });
        [[-1, 1.5], [1, 1.5], [-1, -1.5], [1, -1.5]].forEach(p => {
            const e = new THREE.Mesh(engineGeo, engineMat);
            e.position.set(p[0], 0.6, p[1]);
            car.add(e);
        });

        // Trail Light
        const trailLight = new THREE.PointLight(0x60a5fa, 1, 10);
        trailLight.position.set(0, 1, 2);
        car.add(trailLight);

        scene.add(car);

        // --- PHYSICS & CONTROLS ---
        const player = {
            pos: new THREE.Vector3(0, 0, 40),
            vel: new THREE.Vector3(),
            dir: Math.PI, // Face North
            speed: 0,
            hoverHeight: 0
        };

        const keys = { w: false, a: false, s: false, d: false, space: false };
        const joystick = { x:0, y:0, active:false };

        window.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();
            if(keys.hasOwnProperty(k) || e.code === 'Space') {
                if(e.code === 'Space') keys.space = true;
                else keys[k] = true;
            }
        });
        window.addEventListener('keyup', e => {
            const k = e.key.toLowerCase();
            if(keys.hasOwnProperty(k) || e.code === 'Space') {
                if(e.code === 'Space') keys.space = false;
                else keys[k] = false;
            }
        });

        // Mobile Logic
        const stickZone = document.getElementById('joystick-zone');
        const stickNub = document.getElementById('stick-nub');
        const boostBtn = document.getElementById('boost-btn');

        stickZone.addEventListener('touchstart', e => {
            e.preventDefault(); joystick.active=true; handleTouch(e.touches[0]);
        });
        stickZone.addEventListener('touchmove', e => {
            e.preventDefault(); if(joystick.active) handleTouch(e.touches[0]);
        });
        const endTouch = (e) => { 
            e.preventDefault(); joystick.active=false; joystick.x=0; joystick.y=0; 
            stickNub.style.transform = `translate(-50%, -50%)`;
        };
        stickZone.addEventListener('touchend', endTouch);
        
        boostBtn.addEventListener('touchstart', e => { e.preventDefault(); keys.space = true; });
        boostBtn.addEventListener('touchend', e => { e.preventDefault(); keys.space = false; });

        function handleTouch(touch) {
            const rect = stickZone.getBoundingClientRect();
            const cx = rect.left + rect.width/2;
            const cy = rect.top + rect.height/2;
            const dx = (touch.clientX - cx) / (rect.width/2);
            const dy = (touch.clientY - cy) / (rect.height/2);
            joystick.x = Math.max(-1, Math.min(1, dx));
            joystick.y = Math.max(-1, Math.min(1, dy));
            
            const moveX = joystick.x * (rect.width/2);
            const moveY = joystick.y * (rect.height/2);
            stickNub.style.transform = `translate(calc(-50% + ${moveX}px), calc(-50% + ${moveY}px))`;
        }


        // --- LOOP ---
        function update() {
            // Logic
            let gas = 0; let turn = 0;

            if(joystick.active) {
                gas = -joystick.y; turn = -joystick.x;
            } else {
                if(keys.w) gas += 1;
                if(keys.s) gas -= 1;
                if(keys.a) turn += 1;
                if(keys.d) turn -= 1;
            }

            const MAX = keys.space ? 1.8 : 1.0;
            const ACC = 0.05;
            const FRICTION = 0.94;

            player.speed += gas * ACC;
            player.speed *= FRICTION;
            
            // Speed clamp
            if(player.speed > MAX) player.speed = MAX;
            if(player.speed < -MAX/2) player.speed = -MAX/2;

            if(Math.abs(player.speed) > 0.01) {
                player.dir += turn * 0.06 * Math.sign(player.speed);
            }

            player.vel.set(Math.sin(player.dir) * player.speed, 0, Math.cos(player.dir) * player.speed);
            player.pos.add(player.vel);

            // Boundary
            const LIMIT = 190;
            if(Math.abs(player.pos.x) > LIMIT) player.pos.x = Math.sign(player.pos.x)*LIMIT;
            if(Math.abs(player.pos.z) > LIMIT) player.pos.z = Math.sign(player.pos.z)*LIMIT;

            // Hover Animation
            player.hoverHeight = 1 + Math.sin(Date.now() * 0.005) * 0.1;

            // Apply to Car
            car.position.copy(player.pos);
            car.position.y = player.hoverHeight;
            car.rotation.y = player.dir;
            
            // Banking
            car.rotation.z = -turn * 0.2 * Math.min(Math.abs(player.speed), 1);
            car.rotation.x = -player.speed * 0.15;

            // Camera
            const camOff = new THREE.Vector3(0, 25, -30);
            camOff.applyAxisAngle(new THREE.Vector3(0,1,0), player.dir);
            const camTarget = player.pos.clone().add(camOff);
            camera.position.lerp(camTarget, 0.1);
            camera.lookAt(player.pos);

            // Check Interaction
            checkModals();
            
            // Animate Projects
            interactables.forEach(item => {
                // Bobbing labels
                const lbl = item.mesh.children[item.mesh.children.length-1];
                lbl.position.y = 10 + Math.sin(Date.now()*0.003)*0.5;
            });

            renderer.render(scene, camera);
            requestAnimationFrame(update);
        }

        const modal = document.getElementById('modal');
        const mTitle = document.getElementById('modal-title');
        const mDesc = document.getElementById('modal-desc');
        const mBadge = document.getElementById('modal-badge');
        const mLink = document.getElementById('modal-link');
        const mTags = document.getElementById('modal-tags');
        
        let activeProject = null;

        function checkModals() {
            let nearby = null;
            let dist = 999;

            interactables.forEach(i => {
                const d = player.pos.distanceTo(new THREE.Vector3(i.pos.x, 0, i.pos.z));
                if(d < i.radius + 4) {
                    nearby = i;
                }
            });

            if(nearby && activeProject !== nearby.data.title) {
                openModal(nearby);
                activeProject = nearby.data.title;
            } else if(!nearby && activeProject) {
                closeModal();
                activeProject = null;
            }
        }

        function openModal(item) {
            mTitle.innerText = item.data.title;
            mDesc.innerText = item.data.desc;
            mLink.href = item.data.link;
            mBadge.innerText = item.config.name;
            mBadge.style.backgroundColor = item.config.hex;
            mLink.style.backgroundColor = item.config.hex;

            mTags.innerHTML = '';
            item.data.tech.forEach(t => {
                const span = document.createElement('span');
                span.className = 'tag';
                span.innerText = t;
                mTags.appendChild(span);
            });
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }


        // Init
        setTimeout(() => {
            document.getElementById('loader').style.opacity = 0;
            setTimeout(() => { 
                document.getElementById('loader').remove();
                update(); 
            }, 600);
        }, 1200);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
