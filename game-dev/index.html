<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bhanu Saini | Solarpunk Portfolio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --c-primary: #2563eb; 
            --c-accent: #f59e0b; 
            --c-text: #1e293b;
            --c-bg-ui: rgba(255, 255, 255, 0.85);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { overflow: hidden; background: #e0f2fe; font-family: 'Outfit', sans-serif; color: var(--c-text); }
        
        #canvas-container { position: absolute; inset: 0; z-index: 1; }
        
        /* UI Layer */
        #ui-layer {
            position: absolute; inset: 0; z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 25px;
        }

        /* HUD */
        .hud-top {
            display: flex; justify-content: space-between; align-items: flex-start;
        }
        
        .profile-card {
            background: var(--c-bg-ui); 
            padding: 20px 30px; 
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.5);
            animation: slideDown 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            max-width: 350px;
        }
        .profile-card h1 { font-weight: 900; font-size: 1.5rem; letter-spacing: -0.5px; color: #0f172a; margin-bottom: 5px; }
        .profile-card p { color: var(--c-primary); font-weight: 700; font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase; }

        .score-display {
            background: var(--c-bg-ui); padding: 10px 20px; border-radius: 30px;
            font-weight: 900; font-size: 1.2rem; color: #0f172a;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 2px solid #2563eb;
            display: flex; align-items: center; gap: 10px;
            animation: slideDown 0.8s 0.1s backwards;
        }
        .score-icon { color: #2563eb; }

        .nav-pills {
            display: flex; gap: 10px; flex-direction: column; align-items: flex-end;
            margin-top: 15px;
            animation: slideDown 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s backwards;
        }
        .nav-pill {
            background: var(--c-bg-ui); padding: 8px 16px; border-radius: 30px;
            font-weight: 700; font-size: 0.75rem; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex; align-items: center; gap: 8px;
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; }

        /* Controls Hint */
        .controls-hint {
            position: absolute; bottom: 30px; right: 30px;
            background: var(--c-bg-ui); padding: 20px; border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: right; backdrop-filter: blur(10px);
        }
        .key {
            display: inline-block; background: #fff; color: #334155;
            padding: 6px 10px; border-radius: 6px; font-weight: 800; font-size: 12px;
            margin: 2px; box-shadow: 0 3px 0 #cbd5e1; border: 1px solid #e2e8f0;
        }

        /* Modal */
        #modal {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 90%; max-width: 550px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            opacity: 0; pointer-events: none;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 20; display: flex; flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            border: 1px solid #fff;
        }
        #modal.active { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
        
        .modal-header { padding: 30px 30px 10px; }
        .modal-badge { 
            display: inline-block; padding: 6px 12px; border-radius: 20px; 
            font-size: 0.7rem; font-weight: 800; letter-spacing: 0.5px; margin-bottom: 10px; color: white;
        }
        
        #modal-title { 
            font-weight: 900; font-size: 2rem; color: #0f172a; line-height: 1.1; margin-bottom: 10px; 
        }
        
        .modal-body { padding: 0 30px 30px; }
        #modal-desc { color: #475569; font-size: 1.05rem; line-height: 1.6; margin-bottom: 25px; }
        
        .tags-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 25px; }
        .tag { 
            background: #f1f5f9; color: #334155; padding: 6px 12px; 
            border-radius: 8px; font-size: 0.75rem; font-weight: 700;
        }
        
        .contact-links { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .contact-link {
            text-decoration: none; color: #2563eb; font-weight: bold; font-size: 0.9rem;
            border-bottom: 2px solid #bfdbfe; transition: 0.2s;
        }
        .contact-link:hover { color: #1e40af; border-color: #2563eb; }
        
        .action-btn {
            display: block; background: #0f172a; color: #fff; text-align: center;
            padding: 16px; font-weight: 700; border-radius: 12px;
            text-decoration: none; transition: transform 0.2s, background 0.2s;
        }
        .action-btn:hover { transform: translateY(-2px); background: #1e293b; }

        /* Loader */
        #loader {
            position: fixed; inset: 0; background: #eff6ff; z-index: 100;
            display: flex; align-items: center; justify-content: center; flex-direction: column;
            transition: opacity 0.6s ease-in-out;
        }
        .spinner {
            width: 50px; height: 50px; border: 4px solid #bfdbfe; border-top: 4px solid #2563eb;
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
        }

        /* Floating Text FX */
        .float-text {
            position: absolute; color: #2563eb; font-weight: 900; 
            font-size: 1.2rem; pointer-events: none; text-shadow: 0 2px 5px rgba(0,0,0,0.1);
            animation: floatUp 1s forwards;
        }
        @keyframes floatUp { 0% { opacity:1; transform:translateY(0); } 100% { opacity:0; transform:translateY(-50px); } }

        /* Mobile */
        #mobile-ui { display: none; pointer-events: none; position: absolute; inset: 0; }
        .joystick-zone { position: absolute; bottom: 40px; left: 40px; width: 140px; height: 140px; pointer-events: auto; background: rgba(255,255,255,0.2); border-radius: 50%; backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.4); }
        .joystick-nub { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 50px; height: 50px; background: white; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .boost-btn {
            position: absolute; bottom: 60px; right: 40px; width: 70px; height: 70px;
            background: white; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            display: flex; align-items: center; justify-content: center; pointer-events: auto;
            color: #2563eb; font-weight: 900; font-size: 12px;
        }
        .boost-btn:active { transform: scale(0.95); background: #f8fafc; }

        @media (max-width: 768px) {
            .controls-hint { display: none; }
            #mobile-ui { display: block; }
            .profile-card { padding: 15px; margin-top: 40px; } /* Push down for mobile safe area */
            .nav-pills { display: none; }
        }

        @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div style="font-weight: 700; color: #2563eb; letter-spacing: 1px;">INITIALIZING CITY OS...</div>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="hud-top">
            <div>
                <div class="profile-card">
                    <h1>BHANU SAINI</h1>
                    <p>Interactive Portfolio v6.0</p>
                </div>
            </div>
            
            <div style="display: flex; flex-direction: column; align-items: flex-end;">
                <div class="score-display">
                    <span class="score-icon">✦</span>
                    <span id="score-val">0</span> MB
                </div>
                
                <div class="nav-pills">
                    <div class="nav-pill" style="color: #1e293b; background: white;"><div class="dot" style="background:#1e293b"></div> HQ (Center)</div>
                    <div class="nav-pill" style="color: #db2777"><div class="dot" style="background:#db2777"></div> GAMES (North)</div>
                    <div class="nav-pill" style="color: #2563eb"><div class="dot" style="background:#2563eb"></div> WEB (West)</div>
                    <div class="nav-pill" style="color: #ca8a04"><div class="dot" style="background:#ca8a04"></div> DATA (East)</div>
                </div>
            </div>
        </div>

        <div class="controls-hint">
            <div style="margin-bottom:8px; color:#64748b; font-weight:600; font-size:0.8rem;">HOVER CONTROLS</div>
            <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> to Drive<br>
            <span class="key" style="width: 60px; margin-top:8px;">SPACE</span> to Boost
        </div>

        <div id="mobile-ui">
            <div class="joystick-zone" id="joystick-zone"><div class="joystick-nub" id="stick-nub"></div></div>
            <div class="boost-btn" id="boost-btn">BOOST</div>
        </div>
    </div>

    <div id="modal">
        <div class="modal-header">
            <span class="modal-badge" id="modal-badge">CATEGORY</span>
            <h2 id="modal-title">Project Title</h2>
        </div>
        <div class="modal-body">
            <p id="modal-desc">Description text.</p>
            
            <!-- Specific for Contact -->
            <div class="contact-links" id="modal-contacts" style="display:none;">
                <a href="#" class="contact-link" id="c-github">GitHub</a>
                <a href="#" class="contact-link" id="c-linkedin">LinkedIn</a>
                <a href="#" class="contact-link" id="c-email">Email</a>
            </div>

            <div class="tags-container" id="modal-tags"></div>
            <a href="#" target="_blank" class="action-btn" id="modal-link">VIEW PROJECT</a>
        </div>
    </div>

    <script>
        // --- DATA ---
        const ZONES = {
            GAMES: { color: 0xdb2777, name: "GAME DEV", hex: "#db2777" },
            WEB: { color: 0x2563eb, name: "WEB DEV", hex: "#2563eb" },
            DATA: { color: 0xca8a04, name: "DATA SCIENCE", hex: "#ca8a04" },
            HQ: { color: 0x1e293b, name: "HEADQUARTERS", hex: "#1e293b" }
        };

        const PROJECTS = [
            // --- HQ ---
            { title: "Bhanu's HQ", desc: "Welcome to my central command. Connect with me or view my resume.", tech: ["Resume", "Contact", "About"], link: "#", type: "HQ", pos: {x: 0, z: 0}, isContact: true },
            
            // --- GAMES (North, -Z) ---
            { title: "Echo Shooter", desc: "Neon arena shooter. Survive waves, use overdrive abilities, and score combos.", tech: ["JS", "Canvas", "Action"], link: "https://echo-shooter.pages.dev", type: "GAMES", pos: {x: 45, z: -50} },
            { title: "Portal Nexus", desc: "Survival RPG in a 100-room labyrinth with shifting portals and secrets.", tech: ["React", "TypeScript", "RPG"], link: "https://portal-nexus.pages.dev", type: "GAMES", pos: {x: -45, z: -70} },
            { title: "Neon Maze", desc: "3D Procedural maze escape with time limits and laser traps.", tech: ["Three.js", "WebGL"], link: "https://bhanu2006-24.github.io/neon-maze", type: "GAMES", pos: {x: 45, z: -90} },
            { title: "Antigravity", desc: "Top-down shooter experimenting with gravity mechanics and boss AI.", tech: ["Physics", "Canvas"], link: "https://antigravity-game.pages.dev", type: "GAMES", pos: {x: -35, z: -110} },
            { title: "Bomber Legends", desc: "Classic arcade bomber remake with destructible grid environments.", tech: ["React", "Grid Logic"], link: "https://bomber-legends.pages.dev", type: "GAMES", pos: {x: 35, z: -130} },

            // --- WEB (West, -X) ---
            { title: "NovaNews", desc: "Modern news aggregator with clean UI and smart categorization.", tech: ["React 19", "Vite", "API"], link: "https://github.com/bhanu2006-24/novanews", type: "WEB", pos: {x: -70, z: 30} },
            { title: "GrooveWave", desc: "Music analytics SaaS dashboard with real-time visualization.", tech: ["SaaS", "Data Viz"], link: "https://github.com/bhanu2006-24", type: "WEB", pos: {x: -100, z: -30} },
            { title: "Atmosphere AI", desc: "Environmental monitoring dashboard powered by AI predictions.", tech: ["AI", "Analytics"], link: "https://github.com/bhanu2006-24", type: "WEB", pos: {x: -130, z: 30} },
            { title: "RemoteNexus", desc: "Job portal connecting professionals with premium remote work.", tech: ["React", "Node.js"], link: "https://github.com/bhanu2006-24", type: "WEB", pos: {x: -160, z: -30} },
            { title: "Krishna Books", desc: "Online bookstore and library management system.", tech: ["E-commerce", "Web"], link: "https://github.com/bhanu2006-24", type: "WEB", pos: {x: -100, z: 65} },

            // --- DATA (East, +X) ---
            { title: "Crypto Pulse", desc: "Live cryptocurrency market tracker with portfolio management.", tech: ["React", "Finance API"], link: "https://github.com/bhanu2006-24/crypto-pulse", type: "DATA", pos: {x: 70, z: -30} },
            { title: "IMDb Analytics", desc: "Data dashboard analyzing movie trends and correlations.", tech: ["Python", "Plotly"], link: "https://github.com/bhanu2006-24", type: "DATA", pos: {x: 100, z: 30} },
            { title: "Img Toolkit", desc: "Browser-based image processing tools (remove bg, filters).", tech: ["Streamlit", "CV"], link: "https://github.com/bhanu2006-24/img-toolkit", type: "DATA", pos: {x: 130, z: -30} },
            { title: "T-Shirt Gen", desc: "Procedural design generator for apparel using computer vision.", tech: ["Python", "OpenCV"], link: "https://github.com/bhanu2006-24/tshirtgen", type: "DATA", pos: {x: 160, z: 30} },
            { title: "Steam Analytics", desc: "End-to-end pipeline scraping Steam data for market trends.", tech: ["Scraping", "Pandas"], link: "https://github.com/bhanu2006-24", type: "DATA", pos: {x: 100, z: 65} }
        ];

        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe0f2fe);
        scene.fog = new THREE.Fog(0xe0f2fe, 30, 160);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 300);
        camera.position.set(0, 40, 50);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // --- LIGHTING ---
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0xe0f2fe, 0.6);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xfff7ed, 1.2);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.left = -120; dirLight.shadow.camera.right = 120;
        dirLight.shadow.camera.top = 120; dirLight.shadow.camera.bottom = -120;
        scene.add(dirLight);

        // --- WORLD GEN ---
        const groundGeo = new THREE.PlaneGeometry(500, 500);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0xf1f5f9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI/2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Procedural Roads - WIDER to prevent overlap
        const roadGroup = new THREE.Group();
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.8 });
        
        // Z-Axis Road (North/South) - Width increased to 26
        const roadZ = new THREE.Mesh(new THREE.PlaneGeometry(30, 500), roadMat);
        roadZ.rotation.x = -Math.PI/2; roadZ.position.y = 0.05; roadZ.receiveShadow = true;
        roadGroup.add(roadZ);
        
        // X-Axis Road (East/West) - Width increased to 26
        const roadX = new THREE.Mesh(new THREE.PlaneGeometry(500, 30), roadMat);
        roadX.rotation.x = -Math.PI/2; roadX.position.y = 0.06; roadX.receiveShadow = true;
        roadGroup.add(roadX);

        // Dashed lines
        const lineGeo = new THREE.PlaneGeometry(1, 6);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const lines = new THREE.InstancedMesh(lineGeo, lineMat, 300);
        lines.rotation.x = -Math.PI/2; lines.position.y = 0.08;
        
        let dummy = new THREE.Object3D();
        let idx = 0;
        // Z-road lines
        for(let i=-240; i<240; i+=12) {
            dummy.position.set(0, 0, i);
            dummy.rotation.set(0,0,0);
            dummy.updateMatrix(); lines.setMatrixAt(idx++, dummy.matrix);
        }
        // X-road lines
        for(let i=-240; i<240; i+=12) {
            dummy.position.set(i, 0, 0);
            dummy.rotation.set(0,0,Math.PI/2);
            dummy.updateMatrix(); lines.setMatrixAt(idx++, dummy.matrix);
        }
        roadGroup.add(lines);

        scene.add(roadGroup);

        // HQ Plaza Base (Larger)
        const plazaGeo = new THREE.CylinderGeometry(20, 22, 0.4, 64);
        const plazaMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0 });
        const plaza = new THREE.Mesh(plazaGeo, plazaMat);
        plaza.position.y = 0.2;
        plaza.receiveShadow = true;
        scene.add(plaza);

        // Street Lamps
        const lampGeo = new THREE.CylinderGeometry(0.2, 0.2, 8);
        const lampMat = new THREE.MeshStandardMaterial({ color: 0x64748b });
        const lightGeo = new THREE.SphereGeometry(0.8);
        const lightMat = new THREE.MeshStandardMaterial({ color: 0xffedd5, emissive: 0xffaa00, emissiveIntensity: 0.5 });

        function createLamp(x, z) {
            const grp = new THREE.Group();
            const pole = new THREE.Mesh(lampGeo, lampMat);
            pole.position.y = 4;
            const bulb = new THREE.Mesh(lightGeo, lightMat);
            bulb.position.y = 8;
            grp.add(pole); grp.add(bulb);
            
            grp.position.set(x, 0, z);
            return grp;
        }

        // Add lamps along roads - moved further out
        for(let i=-200; i<=200; i+=50) {
            if(Math.abs(i) > 30) {
                scene.add(createLamp(18, i)); // Right of Z road
                scene.add(createLamp(-18, i)); // Left of Z road
                scene.add(createLamp(i, 18)); // Top of X road
                scene.add(createLamp(i, -18)); // Bottom of X road
            }
        }

        // Trees
        const treeGeo = new THREE.ConeGeometry(1.5, 4, 8);
        const trunkGeo = new THREE.CylinderGeometry(0.3, 0.4, 1, 8);
        const treeMat = new THREE.MeshLambertMaterial({ color: 0x10b981 });
        const trunkMat = new THREE.MeshLambertMaterial({ color: 0x78350f });

        function createTree(x, z) {
            const grp = new THREE.Group();
            const top = new THREE.Mesh(treeGeo, treeMat);
            top.position.y = 2.5; top.castShadow = true;
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 0.5;
            grp.add(top); grp.add(trunk);
            grp.position.set(x, 0, z);
            return grp;
        }

        for(let i=0; i<150; i++) {
            const x = (Math.random()-0.5)*400;
            const z = (Math.random()-0.5)*400;
            
            // NO TREES ON ROAD (Road Width is 30, keep clear of +/- 20)
            if(Math.abs(x) < 20 || Math.abs(z) < 20) continue;
            
            scene.add(createTree(x, z));
        }

        // --- CLOUDS ---
        const cloudGeo = new THREE.DodecahedronGeometry(1, 0);
        const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
        const clouds = [];

        function createCloud() {
            const grp = new THREE.Group();
            const scale = 3 + Math.random() * 5;
            for(let i=0; i<5; i++) {
                const puff = new THREE.Mesh(cloudGeo, cloudMat);
                puff.position.set(
                    (Math.random()-0.5)*scale, 
                    (Math.random()-0.5)*scale*0.5, 
                    (Math.random()-0.5)*scale
                );
                puff.scale.setScalar(2 + Math.random());
                grp.add(puff);
            }
            grp.position.set((Math.random()-0.5)*450, 40 + Math.random()*20, (Math.random()-0.5)*450);
            scene.add(grp);
            clouds.push({ mesh: grp, speed: 0.02 + Math.random()*0.03 });
        }

        for(let i=0; i<40; i++) createCloud();

        // --- COLLECTIBLES ---
        const collectibles = [];
        const gemGeo = new THREE.OctahedronGeometry(1.5, 0);
        const gemMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x0088ff, emissiveIntensity: 0.8, metalness: 0.8, roughness: 0.1 });
        
        function spawnCollectible(x, z) {
            const gem = new THREE.Mesh(gemGeo, gemMat);
            gem.position.set(x, 2, z);
            gem.castShadow = true;
            
            // Floating animation helper
            gem.userData = { 
                baseY: 2, 
                offset: Math.random() * Math.PI, 
                speed: 0.002 + Math.random()*0.002 
            };
            
            scene.add(gem);
            collectibles.push(gem);
        }

        // Spawn random crystals
        for(let i=0; i<20; i++) {
            let cx, cz;
            do {
                cx = (Math.random()-0.5)*350;
                cz = (Math.random()-0.5)*350;
            } while(Math.abs(cx)<25 && Math.abs(cz)<25); // Don't spawn inside HQ
            
            spawnCollectible(cx, cz);
        }

        // --- TRAFFIC SYSTEM ---
        const trafficCars = [];
        const carGeo = new THREE.BoxGeometry(2, 1, 4);
        const trafficMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b }); // Taxi yellow

        function createTrafficCar(axis, dir) {
            const car = new THREE.Mesh(carGeo, trafficMat);
            car.castShadow = true;
            car.position.y = 1;
            
            let posVal = (Math.random()-0.5) * 380;
            // Lane offset: +/- 10 units from center (since road is wider)
            const laneOffset = 10; 
            
            if(axis === 'x') {
                car.position.set(posVal, 1, dir * laneOffset); 
                car.rotation.y = dir === 1 ? Math.PI/2 : -Math.PI/2;
            } else {
                car.position.set(dir * laneOffset, 1, posVal);
                car.rotation.y = dir === 1 ? 0 : Math.PI;
            }
            
            scene.add(car);
            return { mesh: car, axis: axis, dir: dir, speed: 0.2 + Math.random()*0.15 };
        }

        for(let i=0; i<20; i++) trafficCars.push(createTrafficCar('x', 1));
        for(let i=0; i<20; i++) trafficCars.push(createTrafficCar('x', -1));
        for(let i=0; i<20; i++) trafficCars.push(createTrafficCar('z', 1));
        for(let i=0; i<20; i++) trafficCars.push(createTrafficCar('z', -1));

        // --- PARTICLE SYSTEM ---
        const particles = [];
        const partGeo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
        const partMat = new THREE.MeshBasicMaterial({ color: 0x60a5fa });

        function spawnParticles(pos, count=3, color=0x60a5fa) {
            const mat = color === 0x60a5fa ? partMat : new THREE.MeshBasicMaterial({color: color});
            for(let i=0; i<count; i++) {
                const p = new THREE.Mesh(partGeo, mat);
                p.position.copy(pos);
                p.position.x += (Math.random()-0.5);
                p.position.y += (Math.random()-0.5)*0.5;
                p.position.z += (Math.random()-0.5);
                scene.add(p);
                particles.push({ mesh: p, life: 1.0, vel: new THREE.Vector3((Math.random()-0.5)*0.2, Math.random()*0.2, (Math.random()-0.5)*0.2) });
            }
        }

        // --- PROJECTS ---
        const interactables = [];

        function createTextSprite(text, color) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.font = '900 60px "Outfit"';
            ctx.fillStyle = color;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowBlur = 5; ctx.shadowColor = "rgba(0,0,0,0.5)";
            ctx.fillText(text, 256, 64);
            const tex = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
            sprite.scale.set(12, 3, 1);
            return sprite;
        }

        PROJECTS.forEach(p => {
            const config = ZONES[p.type];
            const group = new THREE.Group();
            group.position.set(p.pos.x, 0, p.pos.z);

            let mesh;
            let collisionRadius = 5; 
            
            if (p.type === 'HQ') {
                collisionRadius = 15;
                // --- HQ REDESIGN ---
                
                // 1. Central Spire
                const spireGeo = new THREE.CylinderGeometry(6, 9, 30, 8);
                const spireMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.2, metalness: 0.5 });
                const spire = new THREE.Mesh(spireGeo, spireMat);
                spire.position.y = 15;
                group.add(spire);

                // 2. Floating Rings
                const r1 = new THREE.Mesh(new THREE.TorusGeometry(12, 0.5, 16, 64), new THREE.MeshBasicMaterial({ color: 0x38bdf8 }));
                r1.rotation.x = Math.PI/2; r1.position.y = 10;
                group.add(r1);

                const r2 = new THREE.Mesh(new THREE.TorusGeometry(15, 0.5, 16, 64), new THREE.MeshBasicMaterial({ color: 0x2563eb }));
                r2.rotation.x = Math.PI/2.2; r2.position.y = 20;
                group.add(r2);

                // 3. Floating Satellites
                for(let k=0; k<4; k++) {
                    const sat = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshStandardMaterial({color: 0xffffff}));
                    sat.position.set(Math.cos(k*Math.PI/2)*18, 25, Math.sin(k*Math.PI/2)*18);
                    group.add(sat);
                }

                // 4. Top Beacon
                const beacon = new THREE.Mesh(new THREE.OctahedronGeometry(3), new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true }));
                beacon.position.y = 35;
                group.add(beacon);

                group.userData = { isHQ: true, r1: r1, r2: r2, beacon: beacon };
            }
            else if(p.type === 'GAMES') {
                const geo = new THREE.BoxGeometry(4, 6, 4);
                const mat = new THREE.MeshStandardMaterial({ color: 0xfce7f3 });
                mesh = new THREE.Mesh(geo, mat);
                mesh.position.y = 3;
                const screen = new THREE.Mesh(new THREE.PlaneGeometry(3, 2), new THREE.MeshBasicMaterial({ color: config.color }));
                screen.position.set(0, 4.5, 2.05);
                group.add(screen);
                mesh.castShadow = true;
                group.add(mesh);
            } 
            else if(p.type === 'WEB') {
                const geo = new THREE.BoxGeometry(6, 10, 6);
                const mat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transmission: 0.2, opacity: 0.9, transparent: true });
                mesh = new THREE.Mesh(geo, mat);
                mesh.position.y = 5;
                const core = new THREE.Mesh(new THREE.BoxGeometry(3, 8, 3), new THREE.MeshLambertMaterial({ color: config.color }));
                core.position.y = 5;
                group.add(core);
                mesh.castShadow = true;
                group.add(mesh);
            } 
            else { // DATA
                const geo = new THREE.CylinderGeometry(4, 4, 7, 6);
                const mat = new THREE.MeshStandardMaterial({ color: 0xfffbeb });
                mesh = new THREE.Mesh(geo, mat);
                mesh.position.y = 3.5;
                mesh.castShadow = true;
                group.add(mesh);
            }

            const label = createTextSprite(p.title, config.hex);
            label.position.set(0, p.type==='HQ' ? 40 : 12, 0);
            group.add(label);

            scene.add(group);
            
            interactables.push({ 
                pos: p.pos, 
                radius: p.type==='HQ'? 22 : 9, 
                collisionRad: collisionRadius, 
                data: p, 
                config: config, 
                mesh: group 
            });
        });

        // --- PLAYER CAR ---
        const car = new THREE.Group();
        // Sleek body
        const bodyGeo = new THREE.BoxGeometry(2.2, 0.6, 4.5);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0.6 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 1; body.castShadow = true;
        car.add(body);

        const cockpit = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.5, 2.5), new THREE.MeshStandardMaterial({ color: 0x1e3a8a, roughness: 0.1, metalness: 0.9 }));
        cockpit.position.set(0, 1.5, -0.2);
        car.add(cockpit);
        
        // Thrusters
        const engineGeo = new THREE.CylinderGeometry(0.5, 0.4, 0.5, 16);
        const engineMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6 });
        [[-1.2, 1.5], [1.2, 1.5], [-1.2, -1.5], [1.2, -1.5]].forEach(p => {
            const e = new THREE.Mesh(engineGeo, engineMat);
            e.rotation.z = Math.PI/2;
            e.position.set(p[0], 0.6, p[1]); car.add(e);
        });
        
        // Rear Afterburner
        const burnGeo = new THREE.ConeGeometry(0.5, 2, 8);
        const burnMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.8 });
        const burner = new THREE.Mesh(burnGeo, burnMat);
        burner.rotation.x = Math.PI/2;
        burner.position.set(0, 1, 3.5);
        burner.visible = false;
        car.add(burner);
        car.userData = { burner: burner };

        scene.add(car);

        // --- PHYSICS ---
        const player = { pos: new THREE.Vector3(0, 0, 50), vel: new THREE.Vector3(), dir: Math.PI, speed: 0, hoverOffset: 0, score: 0 };
        const keys = { w:false, a:false, s:false, d:false, space:false };
        const joystick = { x:0, y:0, active:false };

        window.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();
            if(keys.hasOwnProperty(k) || e.code==='Space') keys[e.code==='Space'?'space':k] = true;
        });
        window.addEventListener('keyup', e => {
            const k = e.key.toLowerCase();
            if(keys.hasOwnProperty(k) || e.code==='Space') keys[e.code==='Space'?'space':k] = false;
        });

        const stickZone = document.getElementById('joystick-zone');
        const stickNub = document.getElementById('stick-nub');
        const boostBtn = document.getElementById('boost-btn');

        stickZone.addEventListener('touchstart', e => { e.preventDefault(); joystick.active=true; handleTouch(e.touches[0]); });
        stickZone.addEventListener('touchmove', e => { e.preventDefault(); if(joystick.active) handleTouch(e.touches[0]); });
        stickZone.addEventListener('touchend', e => { e.preventDefault(); joystick.active=false; joystick.x=0; joystick.y=0; stickNub.style.transform = `translate(-50%, -50%)`; });
        boostBtn.addEventListener('touchstart', e => { e.preventDefault(); keys.space = true; });
        boostBtn.addEventListener('touchend', e => { e.preventDefault(); keys.space = false; });

        function handleTouch(touch) {
            const rect = stickZone.getBoundingClientRect();
            const dx = (touch.clientX - (rect.left+rect.width/2)) / (rect.width/2);
            const dy = (touch.clientY - (rect.top+rect.height/2)) / (rect.height/2);
            joystick.x = Math.max(-1, Math.min(1, dx));
            joystick.y = Math.max(-1, Math.min(1, dy));
            stickNub.style.transform = `translate(calc(-50% + ${joystick.x*(rect.width/2)}px), calc(-50% + ${joystick.y*(rect.height/2)}px))`;
        }

        // --- GAME LOOP ---
        function update() {
            // 1. Player Physics - INCREASED SPEED
            let gas = joystick.active ? -joystick.y : (keys.w ? 1 : (keys.s ? -1 : 0));
            let turn = joystick.active ? -joystick.x : (keys.a ? 1 : (keys.d ? -1 : 0));
            
            // FASTER SETTINGS
            const MAX = keys.space ? 2.5 : 1.2; 
            const ACC = 0.05; 
            const FRICTION = 0.96;

            player.speed += gas * ACC;
            player.speed *= FRICTION;
            if(player.speed > MAX) player.speed = MAX;
            if(player.speed < -MAX/2) player.speed = -MAX/2;

            if(Math.abs(player.speed) > 0.01) {
                player.dir += turn * 0.06 * Math.sign(player.speed);
            }

            player.vel.set(Math.sin(player.dir) * player.speed, 0, Math.cos(player.dir) * player.speed);
            const nextPos = player.pos.clone().add(player.vel);
            
            // 2. COLLISION
            let hasCollision = false;
            const playerRad = 2.5;

            interactables.forEach(obj => {
                const objPos = new THREE.Vector3(obj.pos.x, 0, obj.pos.z);
                if(nextPos.distanceTo(objPos) < (obj.collisionRad + playerRad)) {
                    hasCollision = true;
                    const pushVec = player.pos.clone().sub(objPos).normalize();
                    player.pos.add(pushVec.multiplyScalar(1));
                    player.speed *= -0.5;
                }
            });

            if(!hasCollision) {
                player.pos.add(player.vel);
            }

            // Bounds
            const LIMIT = 240;
            if(Math.abs(player.pos.x) > LIMIT) player.pos.x = Math.sign(player.pos.x)*LIMIT;
            if(Math.abs(player.pos.z) > LIMIT) player.pos.z = Math.sign(player.pos.z)*LIMIT;

            // Visuals
            player.hoverOffset = Math.sin(Date.now() * 0.008) * 0.2;
            car.position.copy(player.pos);
            car.position.y = 1 + player.hoverOffset;
            car.rotation.y = player.dir;
            car.rotation.z = -turn * 0.3 * Math.min(Math.abs(player.speed), 1); // More bank
            car.rotation.x = -player.speed * 0.1; // Pitch forward

            // Afterburner FX
            car.userData.burner.visible = keys.space && Math.abs(player.speed) > 1;
            car.userData.burner.scale.setScalar(0.8 + Math.random()*0.4);

            // Particles
            if(keys.space && Math.abs(player.speed) > 0.5) spawnParticles(player.pos, 2);
            // Drift Sparks
            if(Math.abs(turn) > 0.8 && Math.abs(player.speed) > 0.8) spawnParticles(player.pos, 1, 0xffff00);

            for(let i=particles.length-1; i>=0; i--) {
                const p = particles[i];
                p.life -= 0.05;
                p.mesh.position.add(p.vel);
                p.mesh.scale.setScalar(p.life);
                p.mesh.material.opacity = p.life;
                if(p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); }
            }

            // 3. COLLECTIBLES LOGIC
            for(let i=collectibles.length-1; i>=0; i--) {
                const c = collectibles[i];
                c.rotation.y += 0.02;
                c.position.y = c.userData.baseY + Math.sin(Date.now()*c.userData.speed + c.userData.offset)*0.5;
                
                if(player.pos.distanceTo(c.position) < 4) {
                    // Collected!
                    scene.remove(c);
                    collectibles.splice(i, 1);
                    player.score += 100;
                    document.getElementById('score-val').innerText = player.score;
                    
                    // FX
                    spawnParticles(c.position, 10, 0x00ffff);
                    
                    // Floating Text
                    const div = document.createElement('div');
                    div.className = 'float-text';
                    div.innerText = "+100 MB";
                    div.style.left = (window.innerWidth/2) + 'px';
                    div.style.top = (window.innerHeight/2 - 50) + 'px';
                    document.body.appendChild(div);
                    setTimeout(() => div.remove(), 1000);
                }
            }

            // 4. ENV UPDATES
            clouds.forEach(c => {
                c.mesh.position.x += c.speed;
                if(c.mesh.position.x > 250) c.mesh.position.x = -250;
            });
            trafficCars.forEach(t => {
                if(t.axis === 'x') {
                    t.mesh.position.x += t.speed * t.dir;
                    if(Math.abs(t.mesh.position.x) > 250) t.mesh.position.x = -250 * t.dir;
                } else {
                    t.mesh.position.z += t.speed * t.dir;
                    if(Math.abs(t.mesh.position.z) > 250) t.mesh.position.z = -250 * t.dir;
                }
            });

            // 5. Camera Shake & Follow
            const camOff = new THREE.Vector3(0, 30, -40);
            camOff.applyAxisAngle(new THREE.Vector3(0,1,0), player.dir);
            const camTarget = player.pos.clone().add(camOff);
            // Shake
            if(keys.space) {
                camTarget.x += (Math.random()-0.5)*0.5;
                camTarget.y += (Math.random()-0.5)*0.5;
                camTarget.z += (Math.random()-0.5)*0.5;
            }
            camera.position.lerp(camTarget, 0.1);
            camera.lookAt(player.pos);

            // 6. Interactions & Animations
            checkModals();
            interactables.forEach(i => {
                const lbl = i.mesh.children[i.mesh.children.length-1];
                if(lbl.isSprite) lbl.position.y = (i.data.type==='HQ'?40:12) + Math.sin(Date.now()*0.003)*0.5;
                
                // HQ Animations
                if(i.mesh.userData.isHQ) {
                    i.mesh.userData.r1.rotation.z += 0.005;
                    i.mesh.userData.r2.rotation.z -= 0.003;
                    i.mesh.userData.beacon.rotation.y += 0.05;
                }
            });

            renderer.render(scene, camera);
            requestAnimationFrame(update);
        }

        // --- MODAL ---
        const modal = document.getElementById('modal');
        const mTitle = document.getElementById('modal-title');
        const mDesc = document.getElementById('modal-desc');
        const mBadge = document.getElementById('modal-badge');
        const mLink = document.getElementById('modal-link');
        const mTags = document.getElementById('modal-tags');
        const mContacts = document.getElementById('modal-contacts');
        
        let activeProject = null;

        function checkModals() {
            let nearby = null;
            interactables.forEach(i => {
                const d = player.pos.distanceTo(new THREE.Vector3(i.pos.x, 0, i.pos.z));
                if(d < i.radius + 4) nearby = i;
            });

            if(nearby && activeProject !== nearby.data.title) {
                openModal(nearby);
                activeProject = nearby.data.title;
            } else if(!nearby && activeProject) {
                modal.classList.remove('active');
                activeProject = null;
            }
        }

        function openModal(item) {
            mTitle.innerText = item.data.title;
            mDesc.innerText = item.data.desc;
            mBadge.innerText = item.config.name;
            mBadge.style.backgroundColor = item.config.hex;
            
            if(item.data.isContact) {
                mLink.style.display = 'none';
                mContacts.style.display = 'flex';
                document.getElementById('c-github').href = "https://github.com/bhanu2006-24";
                document.getElementById('c-linkedin').href = "https://linkedin.com/in/bhanu-saini-3bb251391";
                document.getElementById('c-email').href = "mailto:bhanupsaini2024@gmail.com";
            } else {
                mLink.style.display = 'block';
                mContacts.style.display = 'none';
                mLink.href = item.data.link;
                mLink.style.backgroundColor = item.config.hex;
            }

            mTags.innerHTML = '';
            item.data.tech.forEach(t => {
                const span = document.createElement('span');
                span.className = 'tag';
                span.innerText = t;
                mTags.appendChild(span);
            });
            modal.classList.add('active');
        }

        setTimeout(() => {
            document.getElementById('loader').style.opacity = 0;
            setTimeout(() => { document.getElementById('loader').remove(); update(); }, 600);
        }, 1200);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
